; =================================================================
; PlatformIO Project Configuration
; Inectra MSC-3US / GRBL CNC Wi-Fi TCP Serial Bridge
; Target Platforms: ESP32 (ESP-32S) & ESP8266 (ESP-01 / ESP-01S)
; =================================================================

[platformio]
default_envs = esp01, esp32

; -----------------------------------------------------------------
; Окружение для ESP-01 / ESP-01S (ESP8266)
; -----------------------------------------------------------------
[env:esp01]
platform = espressif8266
board = esp01_1m
framework = arduino

; Тактовая частота 160 МГц (вдвое быстрее стандартных 80 МГц)
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dout

; Настройки прошивки и монитора порта
upload_speed = 115200
upload_port = COM10
monitor_speed = 115200
monitor_port = COM10

build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF8266_NONOS_SDK_v2_2_1
    -D BEARSSL_SSL_BASIC

; -----------------------------------------------------------------
; Окружение для ESP32 (ESP-32S, ESP-WROOM-32, NodeMCU-32S)
; -----------------------------------------------------------------
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Тактовая частота 240 МГц
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Настройки прошивки и монитора порта
upload_speed = 921600
upload_port = COM10
monitor_speed = 115200
monitor_port = COM10

build_flags = 
    -D CORE_DEBUG_LEVEL=0
